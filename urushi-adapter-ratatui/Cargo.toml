[package]
name = "urushi-adapter-ratatui"
description = "Ratatui adapter for Urushi views and logical styles"
documentation = "https://docs.rs/urushi-adapter-ratatui"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["terminal", "tui", "ratatui"]
categories = ["command-line-interface"]

[dependencies]
ratatui = { version = "0.30.2", default-features = false, features = ["layout-cache", "std"] }
urushi = { path = "../urushi", version = "=0.1.1" }

[[example]]
name = "themed_ratatui"
