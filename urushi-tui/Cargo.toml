[package]
name = "urushi-tui"
description = "Ratatui integration and future full-screen TUI runtime for urushi"
version.workspace = true
edition.workspace = true
license.workspace = true
keywords = ["terminal", "tui", "ratatui"]
categories = ["command-line-interface"]

[dependencies]
ratatui = { version = "0.29", default-features = false }
urushi = { path = "../urushi", version = "=0.1.0" }

[features]
default = ["runtime"]
# The full-screen TUI runtime. Empty until the runtime lands; a consumer that
# only wants the Ratatui adapter sets `default-features = false` today and
# keeps that spelling once the runtime brings its own dependencies.
runtime = []

[[example]]
name = "themed_ratatui"
