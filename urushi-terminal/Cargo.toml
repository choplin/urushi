[package]
name = "urushi-terminal"
description = "Workspace-independent terminal contracts and inspection for the Urushi ecosystem"
version.workspace = true
edition.workspace = true
license.workspace = true
keywords = ["cli", "terminal", "tty"]
categories = ["command-line-interface"]

[dependencies]
crossterm = { version = "0.29", optional = true }
terminal_size = "0.4.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = []
crossterm = ["dep:crossterm"]
