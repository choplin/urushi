[package]
name = "urushi-tui"
description = "Ratatui integration and future full-screen TUI runtime for urushi"
version.workspace = true
edition.workspace = true
license.workspace = true
keywords = ["terminal", "tui", "ratatui"]
categories = ["command-line-interface"]

[dependencies]
futures-core = { version = "0.3", optional = true }
ratatui = { version = "0.29", default-features = false }
tokio = { version = "1", features = ["rt"], optional = true }
urushi = { path = "../urushi", version = "=0.1.0" }

[features]
default = ["runtime"]
# The full-screen TUI runtime: the application value, its effects and
# subscriptions, and the machinery that drives them. A consumer that only wants
# the Ratatui adapter sets `default-features = false`.
runtime = ["dep:futures-core", "dep:tokio"]

[[example]]
name = "themed_ratatui"
