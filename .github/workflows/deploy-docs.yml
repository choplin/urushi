name: Deploy documentation

on:
  push:
    branches: [main]
    paths:
      - website/**
      - assets/brand/urushi-icon.png
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare
    if: >-
      ${{
        github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: documentation-production
      url: https://urushi.choplin.dev/
    steps:
      - name: Check out the deployment revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.20.0

      - name: Install Node.js 22.19
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.19.0
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install website dependencies
        run: pnpm --dir website install --frozen-lockfile

      - name: Build documentation
        run: pnpm --dir website build
        env:
          CI: true

      - name: Validate the deployment artifact
        run: pnpm --dir website exec cf deploy --prebuilt --mode production --dry-run
        env:
          CI: true

      - name: Confirm the revision is still current main
        run: |
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Deploy the validated artifact
        run: pnpm --dir website exec cf deploy --prebuilt --mode production
        env:
          CI: true
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
