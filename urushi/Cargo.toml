[package]
name = "urushi"
description = "Composable styling, components, and terminal rendering for Rust CLIs"
version.workspace = true
edition.workspace = true
license.workspace = true
keywords = ["cli", "terminal", "style", "ansi", "tui"]
categories = ["command-line-interface"]

[dependencies]
urushi-derive = { path = "../urushi-derive", version = "=0.1.0" }
urushi-terminal = { path = "../urushi-terminal", version = "=0.1.0" }
unicode-segmentation.workspace = true
unicode-width.workspace = true

[[bench]]
name = "layout"
harness = false

[dev-dependencies]
divan = "0.1.21"
