[package]
name = "urushi-tui"
description = "Synchronous full-screen presentation and Ratatui integration for urushi"
version.workspace = true
edition.workspace = true
license.workspace = true
keywords = ["terminal", "tui", "ratatui"]
categories = ["command-line-interface"]

[dependencies]
compact_str = "0.9.1"
ratatui = { version = "0.30.2", default-features = false, features = ["layout-cache", "std"] }
urushi = { path = "../urushi", version = "=0.1.0" }
urushi-terminal = { path = "../urushi-terminal", version = "=0.1.0" }
unicode-width.workspace = true

[features]
default = ["crossterm"]
crossterm = ["urushi-terminal/crossterm"]

[[example]]
name = "themed_ratatui"

[[bench]]
name = "cell_buffer"
harness = false

[dev-dependencies]
divan = "0.1.21"
