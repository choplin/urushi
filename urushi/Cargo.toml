[package]
name = "urushi"
description = "Box-model styling for terminal output that renders to plain ANSI strings"
version.workspace = true
edition.workspace = true
license.workspace = true
keywords = ["cli", "terminal", "style", "ansi", "tui"]
categories = ["command-line-interface"]

[dependencies]
ratatui = { version = "0.30.2", default-features = false, optional = true }
unicode-width.workspace = true

[features]
default = []
ratatui = ["dep:ratatui"]

[[example]]
name = "themed_ratatui"
required-features = ["ratatui"]
