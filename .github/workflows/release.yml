name: Release crates

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact semantic version to release
        required: true
        type: string

concurrency:
  group: crates-release
  cancel-in-progress: false

jobs:
  release:
    name: Release ${{ inputs.version }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write

    env:
      RELEASE_VERSION: ${{ inputs.version }}

    steps:
      - name: Check out main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24

      - name: Validate release input
        shell: bash
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid semantic version: $RELEASE_VERSION" >&2
            exit 1
          fi

          if ! grep -Fq "## [$RELEASE_VERSION] - " CHANGELOG.md; then
            echo "CHANGELOG.md has no release section for $RELEASE_VERSION." >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Prepare GitHub Release notes
        shell: bash
        run: |
          awk -v version="$RELEASE_VERSION" '
            index($0, "## [" version "] - ") == 1 { in_release = 1; next }
            in_release && index($0, "## [") == 1 { exit }
            in_release { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"

          if [[ ! -s "$RUNNER_TEMP/release-notes.md" ]]; then
            echo "CHANGELOG.md has no notes for $RELEASE_VERSION." >&2
            exit 1
          fi

      - name: Preview release
        run: nix develop --command cargo-release release "$RELEASE_VERSION" --workspace --no-confirm

      - name: Authenticate with crates.io
        id: crates-io
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18

      - name: Publish, tag, and push
        run: nix develop --command cargo-release release "$RELEASE_VERSION" --workspace --execute --no-confirm
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io.outputs.token }}

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="v$RELEASE_VERSION"

          if gh release view "$release_tag" >/dev/null 2>&1; then
            echo "GitHub Release $release_tag already exists."
            exit 0
          fi

          release_args=(
            "$release_tag"
            --verify-tag
            --title "Urushi $RELEASE_VERSION"
            --notes-file "$RUNNER_TEMP/release-notes.md"
          )

          if [[ "$RELEASE_VERSION" == *-* ]]; then
            release_args+=(--prerelease)
          fi

          gh release create "${release_args[@]}"
